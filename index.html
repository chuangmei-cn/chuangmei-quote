<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创美机电便携报价系统</title>
<style>
:root {
  --bg-deep: #0F1A2C;
  --bg-mid: #1B2D4A;
  --bg-card: #1E3250;
  --accent: #00A3E0;
  --accent-light: #33B5E8;
  --text: #E8ECF1;
  --text-secondary: #8A9BB5;
  --border: #2A3F5F;
  --green: #00C853;
  --yellow: #FFD600;
  --red: #FF5252;
  --price-color: #FF8A00;
  --shadow: 0 4px 20px rgba(0,0,0,0.3);
  --radius: 8px;
  --transition: all 0.2s ease;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
/* Header */
.header {
  background: var(--bg-mid);
  padding: 12px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow);
  border-bottom: 2px solid var(--accent);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.logo {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
}
.logo span { color: var(--text); font-weight: 400; font-size: 14px; }
/* Navigation */
.nav-tabs {
  display: flex;
  gap: 4px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.nav-tab {
  flex: 1;
  min-width: 90px;
  padding: 10px 14px;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  border-radius: var(--radius);
  transition: var(--transition);
  white-space: nowrap;
}
.nav-tab:hover { border-color: var(--accent); color: var(--text); }
.nav-tab.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
/* Page container */
.page { display: none; padding: 16px; }
.page.active { display: block; }
/* Section */
.section-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
  margin: 16px 0 10px;
  padding: 8px 12px;
  background: var(--bg-mid);
  border-left: 4px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.section-title .count {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 400;
}
/* Search bar */
.search-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.search-bar input {
  flex: 1;
  min-width: 200px;
  padding: 10px 14px;
  background: var(--bg-mid);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius);
  font-size: 14px;
}
.search-bar input:focus { outline: none; border-color: var(--accent); }
.search-bar select {
  padding: 10px 14px;
  background: var(--bg-mid);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius);
  font-size: 14px;
  min-width: 140px;
}
/* Product Table */
.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 700px;
}
th {
  background: var(--bg-mid);
  color: var(--accent);
  padding: 10px 8px;
  text-align: left;
  font-weight: 600;
  border-bottom: 2px solid var(--accent);
  white-space: nowrap;
  position: sticky;
  top: 0;
}
td {
  padding: 8px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
tr:nth-child(even) { background: rgba(27,45,74,0.4); }
tr:hover { background: rgba(0,163,224,0.08); }
.price-cell {
  color: var(--price-color);
  font-weight: 700;
  white-space: nowrap;
  font-size: 14px;
}
.price-input {
  width: 90px;
  padding: 6px 8px;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  color: var(--price-color);
  font-weight: 700;
  border-radius: 4px;
  font-size: 13px;
  text-align: right;
}
.price-input:focus { outline: none; border-color: var(--accent); }
.qty-input {
  width: 56px;
  padding: 6px 4px;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 4px;
  font-size: 13px;
  text-align: center;
}
.qty-input:focus { outline: none; border-color: var(--accent); }
.btn-add {
  padding: 6px 14px;
  background: var(--accent);
  border: none;
  color: #fff;
  font-weight: 700;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  white-space: nowrap;
  transition: var(--transition);
}
.btn-add:hover { background: var(--accent-light); }
.btn-add.added { background: var(--green); }
.check-col { width: 36px; text-align: center; }
.check-col input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
/* Card view for mobile */
.card-grid {
  display: none;
  gap: 10px;
}
.product-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  transition: var(--transition);
}
.product-card:hover { border-color: var(--accent); }
.product-card .card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
  gap: 8px;
}
.product-card .model {
  font-weight: 700;
  color: var(--accent);
  font-size: 14px;
}
.product-card .card-price {
  color: var(--price-color);
  font-weight: 700;
  font-size: 16px;
  white-space: nowrap;
}
.product-card .specs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 10px;
}
.product-card .specs span { white-space: nowrap; }
.product-card .card-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
/* Float cart button */
.float-cart {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 200;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0,163,224,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}
.float-cart .badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: var(--red);
  color: #fff;
  border-radius: 50%;
  width: 22px;
  height: 22px;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}
.float-cart:active { transform: scale(0.95); }
/* Cart sidebar */
.cart-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  z-index: 300;
}
.cart-overlay.open { display: block; }
.cart-panel {
  position: fixed;
  top: 0; right: 0;
  width: 420px;
  max-width: 100vw;
  height: 100vh;
  background: var(--bg-mid);
  z-index: 301;
  display: flex;
  flex-direction: column;
  box-shadow: -4px 0 20px rgba(0,0,0,0.5);
  transform: translateX(100%);
  transition: transform 0.3s ease;
}
.cart-panel.open { transform: translateX(0); }
.cart-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.cart-header h3 { color: var(--accent); font-size: 18px; }
.cart-close {
  background: none; border: none; color: var(--text-secondary);
  font-size: 28px; cursor: pointer; width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
}
.cart-close:hover { background: rgba(255,255,255,0.1); color: var(--text); }
.cart-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px;
}
.cart-item {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 8px;
  border: 1px solid var(--border);
}
.cart-item .ci-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.cart-item .ci-name {
  font-weight: 600;
  font-size: 13px;
  flex: 1;
}
.cart-item .ci-remove {
  background: none; border: none; color: var(--red);
  cursor: pointer; font-size: 18px; width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
}
.cart-item .ci-remove:hover { background: rgba(255,82,82,0.15); }
.cart-item .ci-info {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 4px;
}
.cart-item .ci-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
  gap: 8px;
  flex-wrap: wrap;
}
.cart-item .ci-price {
  color: var(--price-color);
  font-weight: 700;
  font-size: 14px;
}
.cart-item .ci-qty-edit {
  display: flex;
  align-items: center;
  gap: 4px;
}
.cart-item .ci-qty-edit button {
  width: 28px; height: 28px;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 4px;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cart-item .ci-qty-edit input {
  width: 44px;
  padding: 4px;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 4px;
  text-align: center;
  font-size: 13px;
}
.cart-item .ci-subtotal {
  color: var(--price-color);
  font-weight: 700;
  font-size: 14px;
  white-space: nowrap;
}
.cart-footer {
  padding: 16px;
  border-top: 2px solid var(--accent);
  background: var(--bg-deep);
}
.cart-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.cart-total .label { font-size: 16px; font-weight: 700; }
.cart-total .amount {
  font-size: 22px;
  font-weight: 700;
  color: var(--price-color);
}
.cart-actions {
  display: flex;
  gap: 8px;
}
.btn {
  padding: 10px 18px;
  border: none;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; flex: 1; }
.btn-primary:hover { background: var(--accent-light); }
.btn-outline {
  background: none;
  border: 1px solid var(--accent);
  color: var(--accent);
}
.btn-outline:hover { background: rgba(0,163,224,0.1); }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { background: #FF6D6D; }
/* Toast */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--green);
  color: #fff;
  padding: 10px 24px;
  border-radius: 24px;
  font-weight: 600;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
  font-size: 14px;
}
.toast.show { opacity: 1; }
/* Empty state */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
/* Responsive */
@media (max-width: 768px) {
  .table-wrap { display: none; }
  .card-grid { display: grid; grid-template-columns: 1fr; }
  .logo { font-size: 16px; }
  .nav-tab { font-size: 12px; padding: 8px 10px; }
  .section-title { font-size: 14px; }
  .price-input { width: 76px; font-size: 12px; }
  .qty-input { width: 44px; }
  .header { padding: 8px 12px; }
  .page { padding: 12px 8px; }
  .cart-panel { width: 100vw; }
  .btn { font-size: 13px; padding: 10px 14px; }
}
@media (min-width: 769px) {
  .card-grid { display: none; }
  .table-wrap { display: block; }
}
/* Combo page */
.combo-selector {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.combo-selector select {
  padding: 10px 14px;
  background: var(--bg-mid);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius);
  font-size: 14px;
  min-width: 200px;
}
.combo-result {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 12px;
}
.combo-result h4 { color: var(--accent); margin-bottom: 8px; }
.combo-total {
  font-size: 24px;
  font-weight: 700;
  color: var(--price-color);
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

/* Discount section */
.discount-bar {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 12px;
}
.discount-bar .discount-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  flex-wrap: wrap;
  gap: 8px;
}
.discount-bar .discount-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
}
.discount-bar .discount-input-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.discount-bar .discount-input {
  width: 70px;
  padding: 8px 6px;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  color: var(--accent);
  border-radius: 4px;
  font-size: 18px;
  font-weight: 700;
  text-align: center;
}
.discount-bar .discount-input:focus { outline: none; border-color: var(--accent); }
.discount-bar .discount-unit {
  font-size: 14px;
  color: var(--text-secondary);
}
.discount-bar .quick-btns {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 6px;
}
.discount-quick {
  padding: 6px 12px;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  border-radius: 16px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: var(--transition);
  white-space: nowrap;
}
.discount-quick:hover { border-color: var(--accent); color: var(--text); }
.discount-quick.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
/* Per-item discount */
.ci-discount {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text-secondary);
}
.ci-discount input {
  width: 44px;
  padding: 3px 4px;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  color: var(--accent);
  border-radius: 3px;
  font-size: 12px;
  font-weight: 600;
  text-align: center;
}
.ci-discount input:focus { outline: none; border-color: var(--accent); }
/* Three-line total */
.cart-total-block {}
.cart-total-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  font-size: 13px;
}
.cart-total-row.original { color: var(--text-secondary); }
.cart-total-row.discounted {
  font-size: 20px;
  font-weight: 700;
  color: var(--price-color);
  padding: 6px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin: 4px 0;
}
.cart-total-row.saved { color: var(--green); font-weight: 600; }
.cart-total-row .val { font-weight: 700; }


/* Global search */
.global-search {
  margin-top: 10px;
  position: relative;
}
.global-search input {
  width: 100%;
  padding: 12px 16px;
  background: var(--bg-deep);
  border: 2px solid var(--border);
  color: var(--text);
  border-radius: var(--radius);
  font-size: 15px;
  transition: var(--transition);
}
.global-search input:focus { outline: none; border-color: var(--accent); }
.global-search input::placeholder { color: var(--text-secondary); }
.global-search .search-hint {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.global-search .match-count {
  color: var(--accent);
  font-weight: 600;
}

/* Customer Info */
.customer-info {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.customer-info .ci-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--border);
}
.customer-info .ci-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 16px;
}
.customer-info .ci-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.customer-info .ci-field.full {
  grid-column: 1 / -1;
}
.customer-info .ci-field label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.customer-info .ci-field input,
.customer-info .ci-field textarea {
  padding: 8px 10px;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 4px;
  font-size: 13px;
  font-family: inherit;
  transition: var(--transition);
}
.customer-info .ci-field input:focus,
.customer-info .ci-field textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.customer-info .ci-field textarea {
  resize: vertical;
  min-height: 60px;
}

/* History Records */
.history-section {
  margin-top: 16px;
}
.history-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  padding: 10px 12px;
  background: var(--bg-mid);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: var(--transition);
}
.history-header:hover { border-color: var(--accent); }
.history-header .hh-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
}
.history-header .hh-arrow {
  color: var(--text-secondary);
  font-size: 14px;
  transition: transform 0.3s;
}
.history-header.expanded .hh-arrow {
  transform: rotate(180deg);
}
.history-body {
  display: none;
  margin-top: 8px;
}
.history-body.open { display: block; }
.history-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  background: var(--bg-card);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
}
.history-table th {
  background: var(--bg-deep);
  color: var(--accent);
  padding: 8px 6px;
  text-align: left;
  font-weight: 600;
  border-bottom: 2px solid var(--accent);
  font-size: 11px;
}
.history-table td {
  padding: 6px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.history-table tr:nth-child(even) { background: rgba(27,45,74,0.4); }
.history-table tr:hover { background: rgba(0,163,224,0.06); }
.history-actions button {
  padding: 4px 8px;
  font-size: 11px;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  border-radius: 3px;
  cursor: pointer;
  margin: 0 2px;
  transition: var(--transition);
}
.history-actions button:hover { border-color: var(--accent); color: var(--text); }

/* Print Styles */
@media print {
  .no-print { display: none !important; }
  body { background: #fff; color: #000; }
  .header, .nav-tabs, .float-cart, .cart-overlay, .cart-panel, .toast,
  .search-bar, .btn, .btn-add, .history-section, .discount-bar,
  .combo-selector, .global-search, .section-title, .customer-info .ci-actions {
    display: none !important;
  }
  .page { display: block !important; padding: 0 !important; }
  .combo-result { border: 2px solid #000; padding: 20px; background: #fff; }
  .combo-result h4 { color: #000; font-size: 18px; }
  .combo-total { border-top: 2px solid #000; color: #000; }

function getPumpCategories() {
  const cats = [...new Set(pumpData.map(p=>p.cat))];

    html += `<div class="section-title">${cat} <span class="count">${items.length}款</span></div>`;

    html += `<div class="table-wrap"><table><thead><tr>
      <th class="check-col">选</th><th>型号</th><th>流量(m³/h)</th><th>扬程(m)</th><th>功率(kW)</th><th>材质</th><th>参考价格</th><th>修改单价</th><th>数量</th><th>操作</th></tr></thead><tbody>`;

      html += `<tr data-search="${p.model} ${p.cat} ${p.sub} ${p.note}">

        <td><input type="number" class="qty-input" id="qty_${id}" value="1" min="1"></td>
        <td><button class="btn-add" id="btn_${id}" onclick="addPumpToCart('${id}')">加入清单</button></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
    // 卡片
    html += `<div class="card-grid">`;
    items.forEach((p, i) => {
      const id = `pump_${cat}_${i}`;
      html += `<div class="product-card" data-search="${p.model} ${p.cat} ${p.sub}">

          <div class="model">${p.model}</div>
          <div class="card-price">${fmtPrice(p.price)}</div>
        </div>
        <div class="specs">

function syncPrice(id) {
  document.getElementById('price_'+id).value = document.getElementById('price_m_'+id).value;
}

function onPriceChange(id) {
  const v = document.getElementById('price_'+id).value;
  const mv = document.getElementById('price_m_'+id);
  if (mv) mv.value = v;
}

function onPumpCheck(id) {
  // 高亮行
}

function addPumpToCart(id) {
  const parts = id.split('_');
  const catIdx = parseInt(parts[2]);
  const cat = parts[1];
  const items = pumpData.filter(p => p.cat === cat);
  const item = items[catIdx];
  if (!item) return;
  const qty = parseInt(document.getElementById('qty_'+id).value) || 1;
  const price = parseInt(document.getElementById('price_'+id).value) || item.price;
  addToCart({
    id: id,
    type: 'pump',
    name: item.model,
    model: item.model,
    spec: `${item.flow}m³/h / ${item.head}m / ${item.power}kW / ${item.sub}`,
    unit: '套',
    price: price,
    qty: qty,
    note: item.note || item.cat
  });
  document.getElementById('btn_'+id).classList.add('added');
  document.getElementById('btn_'+id).textContent = '已加入';
  const mb = document.getElementById('btn_m_'+id);
  if (mb) { mb.classList.add('added'); mb.textContent = '已加入'; }
  showToast('已加入报价清单');
}

    id: id,

    name: item.name,
    spec: item.spec,
    unit: item.unit,
    price: price,

  });

// ============ 购物车 ============
function addToCart(item) {
  const exist = cart.find(c => c.id === item.id);
  if (exist) {
    exist.qty += item.qty;
    exist.price = item.price;
    if (!exist.discount) exist.discount = globalDiscount;
  } else {
    cart.push({...item, discount: globalDiscount});
  }
  updateCart();
}

function removeFromCart(idx) {
  cart.splice(idx, 1);
  updateCart();
}

function updateCartQty(idx, delta) {
  cart[idx].qty = Math.max(1, cart[idx].qty + delta);
  updateCart();
}

function updateCartQtyInput(idx, input) {
  const v = parseInt(input.value);
  if (v > 0) cart[idx].qty = v;
  updateCart();
}

function updateCart() {
  const badge = document.getElementById('cart-badge');
  const itemsArea = document.getElementById('cart-items-area');
  const discountBar = document.getElementById('discount-bar');
  const origTotalEl = document.getElementById('cart-original-total');
  const discTotalEl = document.getElementById('cart-discounted-total');
  const savedRow = document.getElementById('cart-saved-row');
  const savedAmt = document.getElementById('cart-saved-amount');
  const gdInput = document.getElementById('global-discount');
  const comboSummary = document.getElementById('combo-summary');
  const comboTotal = document.getElementById('combo-total');

  if (cart.length === 0) {
    itemsArea.innerHTML = `<div class="empty-state"><div class="icon">&#128203;</div><p>尚未添加产品</p><p style="font-size:12px;margin-top:4px;">在产品列表中勾选并输入数量，点击加入清单</p></div>`;
    discountBar.style.display = 'none';
    badge.style.display = 'none';
    origTotalEl.textContent = '¥0元';
    discTotalEl.textContent = '¥0元';
    savedRow.style.display = 'none';
    if (comboSummary) comboSummary.innerHTML = '<p style="color:var(--text-secondary)">请先在防汛泵和配件页面添加产品</p>';
    if (comboTotal) comboTotal.textContent = '合计：¥0元';
    return;
  }

  discountBar.style.display = 'block';
  if (gdInput) gdInput.value = globalDiscount;
  updateQuickBtns();

  badge.style.display = 'flex';
  badge.textContent = cart.reduce((s, c) => s + c.qty, 0);

  // 确保所有 cart 项有 discount 字段
  cart.forEach(item => { if (!item.discount) item.discount = globalDiscount; });

  // 计算总价
  let originalTotal = 0;
  let discountedTotal = 0;
  cart.forEach(item => {
    const orig = item.price * item.qty;
    originalTotal += orig;
    discountedTotal += Math.round(orig * item.discount / 100);
  });

  // 渲染购物车列表
  let html = '';
  cart.forEach((item, idx) => {
    const origSubtotal = item.price * item.qty;
    const discSubtotal = Math.round(origSubtotal * item.discount / 100);
    const typeLabel = item.type === 'pump' ? '泵' : '配件';
    const discLabel = item.discount < 100 ? ` ${item.discount}折` : '';
    html += `<div class="cart-item">
      <div class="ci-top">
        <div class="ci-name">[${typeLabel}] ${item.name}</div>
        <button class="ci-remove" onclick="removeFromCart(${idx})">&times;</button>
      </div>
      <div class="ci-info">${item.spec || item.note || ''}</div>
      <div class="ci-bottom">
        <div class="ci-price">${fmtPrice(item.price)} / ${item.unit||'套'}</div>
        <div class="ci-discount">
          折扣 <input type="number" value="${item.discount}" min="60" max="100" onchange="onItemDiscountChange(${idx}, this)"> %
        </div>
        <div class="ci-qty-edit">
          <button onclick="updateCartQty(${idx}, -1)">-</button>
          <input type="number" value="${item.qty}" min="1" onchange="updateCartQtyInput(${idx}, this)">
          <button onclick="updateCartQty(${idx}, 1)">+</button>
        </div>
        <div class="ci-subtotal">${fmtPrice(origSubtotal)}${discLabel} → ${fmtPrice(discSubtotal)}</div>
      </div>
    </div>`;
  });
  itemsArea.innerHTML = html;

  // 更新底部总价
  origTotalEl.textContent = fmtPrice(originalTotal);
  discTotalEl.textContent = fmtPrice(discountedTotal);
  if (globalDiscount < 100 || cart.some(c => c.discount < 100)) {
    savedRow.style.display = 'flex';
    savedAmt.textContent = fmtPrice(originalTotal - discountedTotal);
  } else {
    savedRow.style.display = 'none';
  }

  // 更新组合报价页
  if (comboSummary) {
    let cs = '<table style="width:100%;font-size:13px;border-collapse:collapse;">';
    cs += '<tr style="border-bottom:1px solid var(--border);color:var(--accent)"><th style="text-align:left;padding:6px;">类型</th><th style="text-align:left;padding:6px;">名称</th><th style="text-align:right;padding:6px;">单价</th><th style="text-align:center;padding:6px;">数量</th><th style="text-align:center;padding:6px;">折扣</th><th style="text-align:right;padding:6px;">小计</th></tr>';
    cart.forEach(item => {
      const disc = Math.round(item.price * item.qty * item.discount / 100);
      cs += `<tr style="border-bottom:1px solid var(--border);">
        <td style="padding:6px;">${item.type==='pump'?'泵':'配件'}</td>
        <td style="padding:6px;">${item.name}</td>
        <td style="text-align:right;padding:6px;">${fmtPrice(item.price)}</td>
        <td style="text-align:center;padding:6px;">${item.qty}</td>
        <td style="text-align:center;padding:6px;">${item.discount<100?item.discount+'折':'-'}</td>
        <td style="text-align:right;padding:6px;color:var(--price-color);font-weight:700;">${fmtPrice(disc)}</td>
      </tr>`;
    });
    cs += '</table>';
    comboSummary.innerHTML = cs;
    comboTotal.innerHTML = `<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <span>原价合计：${fmtPrice(originalTotal)}</span>
      <span style="color:var(--accent);font-weight:700;font-size:20px;">折扣价：${fmtPrice(discountedTotal)}</span>
    </div>`;
  }
}

function onItemDiscountChange(idx, input) {
  const v = parseInt(input.value);
  if (v >= 60 && v <= 100) {
    cart[idx].discount = v;
    updateCart();
  } else if (v < 60) {
    cart[idx].discount = 60;
    input.value = 60;
    updateCart();
    showToast('单品折扣最低为60%');
  }
}

function onGlobalDiscountChange() {
  const v = parseInt(document.getElementById('global-discount').value);
  if (v >= 60 && v <= 100) {
    globalDiscount = v;
    cart.forEach(item => { item.discount = v; });
    updateCart();
  } else if (v < 60) {
    globalDiscount = 60;
    document.getElementById('global-discount').value = 60;
    cart.forEach(item => { item.discount = 60; });
    updateCart();
    showToast('折扣最低为60%');
  }
}

function setQuickDiscount(val) {
  globalDiscount = val;
  document.getElementById('global-discount').value = val;
  // 同步到所有条目
  cart.forEach(item => { item.discount = val; });
  updateCart();
}

function updateQuickBtns() {
  document.querySelectorAll('.discount-quick').forEach(btn => {
    const txt = btn.textContent.trim();
    let v;
    if (txt === '原价') { v = 100; }
    else { v = parseInt(txt.replace(/[^0-9]/g, '')); }
    btn.classList.toggle('active', v === globalDiscount);
  });
}

function clearCart() {
  cart = [];
  updateCart();
  // 重置按钮状态
  document.querySelectorAll('.btn-add.added').forEach(b => {
    b.classList.remove('added');
    b.textContent = '加入清单';
  });
  showToast('清单已清空');
}

function copyCart() {
  if (cart.length === 0) {
    showToast('请先添加产品到清单');
    return;
  }
  // 计算客户标签
  function getTag(discount) {
    if (discount >= 100) return '';
    if (discount >= 70) return '（老客户专享）';
    return '（供应商专享）';
  }
  // 计算总标签（取折扣最低的）
  const minDisc = Math.min(...cart.map(c => c.discount));
  const totalTag = getTag(minDisc);
  const totalLabel = minDisc >= 100 ? '合计' : (minDisc >= 70 ? '老客户专享价' : '供应商专享价');

  let text = '【创美机电报价清单】\n';
  text += '━━━━━━━━━━━━━━━━\n';
  let discountedTotal = 0;
  cart.forEach((item, idx) => {
    const discSub = Math.round(item.price * item.qty * item.discount / 100);
    discountedTotal += discSub;
    const tag = getTag(item.discount);
    text += `${idx+1}. [${item.type==='pump'?'泵':'配件'}] ${item.name}\n`;
    if (item.spec) text += `   规格：${item.spec}\n`;
    text += `   ${fmtPrice(discSub)} × ${item.qty}${item.unit||'套'}${tag}\n`;
  });
  text += '━━━━━━━━━━━━━━━━\n';
  text += `${totalLabel}：${fmtPrice(discountedTotal)}\n`;
  text += `报价日期：${new Date().toLocaleDateString('zh-CN')}\n`;
  text += '━━━━━━━━━━━━━━━━\n';
  text += '浙江创美机电有限公司\n';
  text += '以上价格含税，含标配附件';

  navigator.clipboard.writeText(text).then(() => {
    showToast('已复制，可直接粘贴发送微信');
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制，可直接粘贴发送微信');
  });
}

// ============ 筛选 ============
function filterPumps() {
  const search = document.getElementById('pump-search').value.toLowerCase();
  const globalQuery = document.getElementById('global-search').value.toLowerCase().trim();
  const catFilter = document.getElementById('pump-category-filter').value;
  document.querySelectorAll('#page-pump .section').forEach(sec => {
    const cat = sec.dataset.cat;
    if (catFilter && cat !== catFilter) { sec.style.display = 'none'; return; }
    let visible = false;
    sec.querySelectorAll('[data-search]').forEach(row => {
      const txt = row.dataset.search.toLowerCase();
      const matchLocal = !search || txt.includes(search);
      const matchGlobal = !globalQuery || txt.includes(globalQuery);
      const match = matchLocal && matchGlobal;
      row.style.display = match ? '' : 'none';
      if (match) visible = true;
    });
    sec.style.display = visible ? '' : 'none';
  });
}

function filterParts() {
  const search = document.getElementById('parts-search').value.toLowerCase();
  const globalQuery = document.getElementById('global-search').value.toLowerCase().trim();
  const catFilter = document.getElementById('parts-category-filter').value;
  document.querySelectorAll('#page-parts .section').forEach(sec => {
    const cat = sec.dataset.cat;
    if (catFilter && cat !== catFilter) { sec.style.display = 'none'; return; }
    let visible = false;
    sec.querySelectorAll('[data-search]').forEach(row => {
      const txt = row.dataset.search.toLowerCase();
      const matchLocal = !search || txt.includes(search);
      const matchGlobal = !globalQuery || txt.includes(globalQuery);
      const match = matchLocal && matchGlobal;
      row.style.display = match ? '' : 'none';
      if (match) visible = true;
    });
    sec.style.display = visible ? '' : 'none';
  });
}

// ============ Tab切换 ============
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');

  const tabMap = {pump:0, parts:1, combo:2};
  document.querySelectorAll('.nav-tab')[tabMap[tab]].classList.add('active');

  // 切换时重新应用全局搜索
  filterAll();

  if (tab === 'combo') updateCart();
}

// ============ 全局搜索 ============
function filterAll() {
  const query = document.getElementById('global-search').value.toLowerCase().trim();
  const matchCountEl = document.getElementById('search-match-count');
  const matchTextEl = document.getElementById('search-match-text');

  if (!query) {
    matchCountEl.style.display = 'none';
    matchTextEl.style.display = 'none';
    // 恢复原有筛选结果
    if (currentTab === 'pump') filterPumps();
    else if (currentTab === 'parts') filterParts();
    return;
  }

  let totalMatch = 0;

  // 搜索水泵页
  if (currentTab === 'pump') {
    document.querySelectorAll('#page-pump .section').forEach(sec => {
      let sectionMatch = 0;
      sec.querySelectorAll('[data-search]').forEach(row => {
        const txt = row.dataset.search.toLowerCase();
        const match = txt.includes(query);
        row.style.display = match ? '' : 'none';
        if (match) sectionMatch++;
      });
      sec.style.display = sectionMatch > 0 ? '' : 'none';
      totalMatch += sectionMatch;
    });
  }

  // 搜索配件页
  if (currentTab === 'parts') {
    document.querySelectorAll('#page-parts .section').forEach(sec => {
      let sectionMatch = 0;
      sec.querySelectorAll('[data-search]').forEach(row => {
        const txt = row.dataset.search.toLowerCase();
        const match = txt.includes(query);
        row.style.display = match ? '' : 'none';
        if (match) sectionMatch++;
      });
      sec.style.display = sectionMatch > 0 ? '' : 'none';
      totalMatch += sectionMatch;
    });
  }

  if (currentTab === 'pump' || currentTab === 'parts') {
    matchCountEl.style.display = 'inline';
    matchTextEl.style.display = 'inline';
    matchCountEl.textContent = totalMatch;
    matchTextEl.textContent = totalMatch > 0 ? ' 条匹配结果' : ' 条匹配 — 换个关键词试试';
    matchTextEl.style.color = totalMatch > 0 ? 'var(--text-secondary)' : 'var(--red)';
  }
}

// ============ 购物车面板 ============
function toggleCart() {
  const panel = document.getElementById('cart-panel');
  const overlay = document.getElementById('cart-overlay');
  if (panel.classList.contains('open')) {
    closeCart();
  } else {
    panel.classList.add('open');
    overlay.classList.add('open');
    updateCart();
  }
}

function closeCart() {
  document.getElementById('cart-panel').classList.remove('open');
  document.getElementById('cart-overlay').classList.remove('open');
}

// ============ Toast ============
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ============ 客户信息管理 ============
function getCustomerInfo() {
  return {
    project: document.getElementById('ci-project').value.trim(),
    customer: document.getElementById('ci-customer').value.trim(),
    phone: document.getElementById('ci-phone').value.trim(),
    date: document.getElementById('ci-date').value,
    model: document.getElementById('ci-model').value.trim(),
    note: document.getElementById('ci-note').value.trim()
  };
}

function setCustomerInfo(info) {
  if (!info) return;
  document.getElementById('ci-project').value = info.project || '';
  document.getElementById('ci-customer').value = info.customer || '';
  document.getElementById('ci-phone').value = info.phone || '';
  document.getElementById('ci-date').value = info.date || '';
  document.getElementById('ci-model').value = info.model || '';
  document.getElementById('ci-note').value = info.note || '';
}

function autoUpdateModelSpec() {
  const models = cart.map(item => `${item.name}×${item.qty}`);
  const modelInput = document.getElementById('ci-model');
  if (!modelInput.value.trim() || modelInput.dataset.autoFilled === 'true') {
    modelInput.value = models.join('; ');
    modelInput.dataset.autoFilled = 'true';
  }
  // 如果用户手动改过，就不自动填充
}

function autoSaveCustomerInfo() {
  const info = getCustomerInfo();
  // 如果用户手动修改了型号规格，标记为非自动填充
  const modelInput = document.getElementById('ci-model');
  if (modelInput.value.trim() !== modelInput.dataset.lastAutoValue) {
    modelInput.dataset.autoFilled = 'false';
  }
  localStorage.setItem('chuangmei_customer_info', JSON.stringify(info));
}

function autoSaveAll() {
  autoSaveCustomerInfo();
  localStorage.setItem('chuangmei_cart', JSON.stringify(cart));
  localStorage.setItem('chuangmei_global_discount', JSON.stringify(globalDiscount));
}

function loadAllFromStorage() {
  // 加载购物车
  const savedCart = localStorage.getItem('chuangmei_cart');
  if (savedCart) {
    try { cart = JSON.parse(savedCart); } catch(e) {}
  }
  // 加载折扣
  const savedDisc = localStorage.getItem('chuangmei_global_discount');
  if (savedDisc) {
    try { globalDiscount = JSON.parse(savedDisc); } catch(e) {}
  }
  // 加载客户信息
  const savedInfo = localStorage.getItem('chuangmei_customer_info');
  if (savedInfo) {
    try { setCustomerInfo(JSON.parse(savedInfo)); } catch(e) {}
  }
}

// ============ 导出报价单 ============
function exportQuote() {
  if (cart.length === 0) {
    showToast('请先添加产品到清单');
    return;
  }
  // 填充打印客户信息
  const info = getCustomerInfo();
  const printDiv = document.getElementById('print-customer-info');
  printDiv.innerHTML = `
    项目名称：${info.project || '-'}&nbsp;&nbsp;&nbsp;&nbsp;
    客户姓名：${info.customer || '-'}&nbsp;&nbsp;&nbsp;&nbsp;
    联系电话：${info.phone || '-'}<br>
    名称：${info.model || '-'}&nbsp;&nbsp;&nbsp;&nbsp;
    日期：${info.date || '-'}
    ${info.note ? '<br>备注：' + info.note : ''}
  `;

  // 更新时间戳
  document.getElementById('ci-date').value = document.getElementById('ci-date').value || new Date().toISOString().slice(0, 10);

  // 切换到组合报价页然后打印
  switchTab('combo');
  setTimeout(() => { window.print(); }, 300);
}

// ============ 历史记录 ============
function saveRecord() {
  if (cart.length === 0) {
    showToast('请先添加产品到清单');
    return;
  }
  const info = getCustomerInfo();
  const minDisc = Math.min(...cart.map(c => c.discount || globalDiscount));
  let discountedTotal = 0;
  cart.forEach(item => {
    discountedTotal += Math.round(item.price * item.qty * (item.discount || globalDiscount) / 100);
  });

  const record = {
    id: Date.now(),
    date: info.date || new Date().toISOString().slice(0, 10),
    project: info.project || '未命名项目',
    customer: info.customer || '未知客户',
    phone: info.phone || '',
    nameList: cart.map(item => item.name).join('、'),
    model: info.model || '',
    note: info.note || '',
    items: JSON.parse(JSON.stringify(cart)),
    total: discountedTotal,
    discount: minDisc,
    savedAt: new Date().toISOString()
  };

  let history = [];
  const savedHistory = localStorage.getItem('chuangmei_history');
  if (savedHistory) {
    try { history = JSON.parse(savedHistory); } catch(e) {}
  }
  history.unshift(record);
  // 最多保留 50 条
  if (history.length > 50) history = history.slice(0, 50);
  localStorage.setItem('chuangmei_history', JSON.stringify(history));
  renderHistory();
  showToast('报价记录已保存');
}

function loadHistory() {
  const savedHistory = localStorage.getItem('chuangmei_history');
  if (!savedHistory) return [];
  try { return JSON.parse(savedHistory); } catch(e) { return []; }
}

function renderHistory() {
  const history = loadHistory();
  const section = document.getElementById('history-section');
  const tbody = document.getElementById('history-tbody');
  const countEl = document.getElementById('history-count');

  if (history.length === 0) {
    section.style.display = 'none';
    return;
  }

  section.style.display = 'block';
  countEl.textContent = history.length;

  let html = '';
  history.forEach((rec, idx) => {
    const totalLabel = rec.discount < 100 ? rec.discount + '折' : '原价';
    html += `<tr>
      <td>${rec.date}</td>
      <td>${rec.project}</td>
      <td>${rec.customer}</td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${rec.nameList || rec.model}</td>
      <td style="color:var(--price-color);font-weight:700;white-space:nowrap;">${fmtPrice(rec.total)} (${totalLabel})</td>
      <td class="history-actions">
        <button onclick="loadRecord(${idx})">加载</button>
        <button onclick="deleteRecord(${idx})" style="color:var(--red)">删除</button>
      </td>
    </tr>`;
  });
  tbody.innerHTML = html;
}

function loadRecord(idx) {
  const history = loadHistory();
  const rec = history[idx];
  if (!rec) return;

  cart = JSON.parse(JSON.stringify(rec.items));
  globalDiscount = rec.discount || 100;

  setCustomerInfo({
    project: rec.project,
    customer: rec.customer,
    phone: rec.phone || '',
    date: rec.date,
    model: rec.model,
    note: rec.note || ''
  });
  document.getElementById('ci-model').dataset.autoFilled = 'false';

  autoSaveAll();
  updateCart();
  switchTab('combo');
  showToast('已加载历史报价记录');
}

function deleteRecord(idx) {
  const history = loadHistory();
  history.splice(idx, 1);
  localStorage.setItem('chuangmei_history', JSON.stringify(history));
  renderHistory();
  showToast('记录已删除');
}

function toggleHistory() {
  const body = document.getElementById('history-body');
  const header = document.getElementById('history-header');
  body.classList.toggle('open');
  header.classList.toggle('expanded');
}

// ============ 覆盖 updateCart 以触发自动保存和型号更新 ============
const _originalUpdateCart = updateCart;
updateCart = function() {
  _originalUpdateCart();
  autoUpdateModelSpec();
  autoSaveAll();
};

// ============ 初始化 ============
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('ci-date').value = new Date().toISOString().slice(0, 10);
  loadAllFromStorage();
  buildPumpSections();
  buildPartsSections();
  updateCart();
  renderHistory();
});
</script>
